<h1>DragonBall-Super Page</h1>
<hr>

<section class="row">
  <div class="col-12 col-sm-6">
    <dragonball-character-insert
      (newCharacterOf)="dragonBallSuperService.addCharacter($event)"
    />
  </div>

  <div class="col-12 col-sm-6">
    <dragonball-character-list
    listName="Listado de Personajes"
    [characters]="dragonBallSuperService.characters()"/>
  </div>

</section>
